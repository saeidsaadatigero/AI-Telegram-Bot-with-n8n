# راه‌اندازی n8n روی ویندوز با Docker Desktop / WSL2
version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-telegram-bot
    restart: unless-stopped
    ports:
      # پورت پنل مدیریت n8n روی مرورگر: http://localhost:5678
      - "5678:5678"
    env_file:
      # متغیرهای محیطی از فایل .env خوانده می‌شوند (این فایل commit نمی‌شود)
      - .env
    volumes:
      # ذخیره‌سازی دائمی Workflow ها، Credential ها و پایگاه‌داده داخلی n8n
      - n8n_data:/home/node/.n8n
      # پوشه اشتراکی برای import کردن فایل Workflow از داخل کانتینر
      - ./workflow:/home/node/workflow

  # تونل عمومی رایگان Cloudflare.
  # سرورهای تلگرام نمی‌توانند به localhost دسترسی داشته باشند، بنابراین برای ثبت Webhook
  # به یک آدرس عمومی HTTPS نیاز داریم. این سرویس یک آدرس *.trycloudflare.com می‌سازد.
  # توجه: این آدرس با هر بار ری‌استارت تغییر می‌کند و باید در WEBHOOK_URL به‌روزرسانی شود.
  # در محیط عملیاتی این سرویس را حذف کرده و دامنه واقعی خود را در WEBHOOK_URL بگذارید.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: n8n-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
    name: n8n_data
